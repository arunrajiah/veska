<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%">
  <!-- Main background -->
  <rect width="1200" height="720" fill="#0f172a"/>

  <!-- Top navbar -->
  <rect x="0" y="0" width="1200" height="48" fill="#1e293b"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#334155" stroke-width="1"/>
  <text x="24" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#6366f1" dominant-baseline="middle">Veska</text>
  <text x="1090" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="middle" text-anchor="end">Acme Corp</text>
  <circle cx="1160" cy="24" r="16" fill="#4f46e5"/>
  <text x="1160" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">A</text>

  <!-- Left sidebar -->
  <rect x="0" y="48" width="200" height="672" fill="#1e293b"/>
  <line x1="200" y1="48" x2="200" y2="720" stroke="#334155" stroke-width="1"/>
  <text x="20" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="middle">📊  Dashboard</text>
  <text x="20" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="middle">🧾  Invoices</text>
  <text x="20" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="middle">💳  Expenses</text>
  <text x="20" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="middle">👥  CRM</text>
  <text x="20" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="middle">🏢  Employees</text>
  <!-- AI Actions (active) -->
  <rect x="12" y="268" width="176" height="36" rx="8" fill="#4f46e5"/>
  <text x="20" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="white" dominant-baseline="middle">🤖  AI Actions</text>
  <text x="20" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" dominant-baseline="middle">⚙️  Settings</text>

  <!-- Main content area -->
  <text x="224" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="white" dominant-baseline="middle">AI Actions</text>
  <text x="224" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8" dominant-baseline="middle">Talk to your business data</text>

  <!-- Chat area background -->
  <rect x="220" y="132" width="956" height="520" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- System message -->
  <text x="698" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" text-anchor="middle" dominant-baseline="middle">Ask me anything about your business. I can read records, create invoices, run reports, and more.</text>
  <line x1="320" y1="178" x2="1076" y2="178" stroke="#1e293b" stroke-width="1"/>

  <!-- User message 1 -->
  <rect x="620" y="192" width="530" height="50" rx="14" fill="#4f46e5"/>
  <text x="885" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="white" text-anchor="middle" dominant-baseline="middle">Create an invoice for Acme Corp for $5,000</text>
  <text x="885" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="white" text-anchor="middle" dominant-baseline="middle">consulting services due in 30 days</text>

  <!-- AI response 1 -->
  <rect x="232" y="256" width="660" height="88" rx="14" fill="#1e293b"/>
  <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" dominant-baseline="middle">✅ Invoice created successfully</text>
  <text x="256" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" dominant-baseline="middle">INV-1042 · Acme Corp · $5,000.00 · Due Jun 17, 2026</text>
  <text x="256" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" dominant-baseline="middle">The invoice is in draft status. Say 'send it' to email it to the customer.</text>

  <!-- User message 2 -->
  <rect x="614" y="360" width="542" height="36" rx="14" fill="#4f46e5"/>
  <text x="885" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="white" text-anchor="middle" dominant-baseline="middle">Run a revenue vs expenses report for this month</text>

  <!-- AI response 2 with bar chart -->
  <rect x="232" y="410" width="700" height="170" rx="14" fill="#1e293b"/>
  <text x="256" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" dominant-baseline="middle">Here's your May 2026 summary:</text>

  <!-- Bar chart -->
  <!-- Revenue bar -->
  <rect x="256" y="452" width="320" height="28" rx="4" fill="#4f46e5"/>
  <text x="590" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0" dominant-baseline="middle" x="264">Revenue</text>
  <text x="264" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" dominant-baseline="middle">Revenue · $124,500</text>

  <!-- Expenses bar -->
  <rect x="256" y="490" width="80" height="28" rx="4" fill="#f59e0b"/>
  <text x="264" y="504" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="white" dominant-baseline="middle">Expenses · $31,200</text>

  <!-- Net -->
  <line x1="256" y1="534" x2="912" y2="534" stroke="#334155" stroke-width="1"/>
  <text x="256" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#22c55e" dominant-baseline="middle">Net Profit: $93,300 (74.9% margin)</text>
  <text x="256" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" dominant-baseline="middle">Strong month — revenue is up 12% vs April.</text>

  <!-- Bottom input bar -->
  <rect x="232" y="618" width="920" height="22" rx="0" fill="#0f172a"/>
  <rect x="232" y="608" width="920" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="260" y="626" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569" dominant-baseline="middle">Ask anything…</text>
  <circle cx="1124" cy="626" r="14" fill="#4f46e5"/>
  <text x="1124" y="626" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" text-anchor="middle" dominant-baseline="middle">↑</text>
</svg>
